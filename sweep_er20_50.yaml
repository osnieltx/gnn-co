program: script_rl.py
method: bayes
metric:
  name: val_apx_ratio_all
  goal: minimize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.003
  gamma:
    values: [0.9, 0.95, 0.99, 1.0]
  n_step:
    values: [3, 5, 7]
  num_iterations:
    values: [3, 4, 5]
  sync_rate:
    values: [250, 500, 1000, 2000]
  eps_last_frame:
    distribution: int_uniform
    min: 2500
    max: 5000
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --curriculum_mode
  - cumulative
  - -n
  - "20,51"
  - --problem
  - mvc
  - --no_attr
  - -b
  - "128"
  - ${args}
